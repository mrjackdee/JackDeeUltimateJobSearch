name: Bootstrap source
on:
  push:
    branches: ['feature/production-job-search-command-center']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check bootstrap payload
        id: payload
        shell: bash
        run: |
          if [ -f bootstrap/chunk_00 ] && [ -f bootstrap/chunk_01 ] && [ -f bootstrap/chunk_02 ] && [ -f bootstrap/chunk_03 ] && [ -f bootstrap/chunk_04 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Expand production source
        if: steps.payload.outputs.present == 'true'
        run: |
          cat bootstrap/chunk_00 bootstrap/chunk_01 bootstrap/chunk_02 bootstrap/chunk_03 bootstrap/chunk_04 > /tmp/app.tar.gz.b64
          base64 -d /tmp/app.tar.gz.b64 > /tmp/app.tar.gz
          tar -xzf /tmp/app.tar.gz -C .
          if [ -f bootstrap/typecheck-fixes.patch ]; then git apply bootstrap/typecheck-fixes.patch; fi
          if [ -f bootstrap/lint-mobile-fixes.patch ]; then git apply bootstrap/lint-mobile-fixes.patch; fi
          if [ -f bootstrap/mobile-ui-polish.patch ]; then git apply bootstrap/mobile-ui-polish.patch; fi
          rm -rf bootstrap
      - uses: actions/setup-node@v4
        if: steps.payload.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        run: npm install --no-audit --no-fund
      - name: Type check
        if: steps.payload.outputs.present == 'true'
        run: npm run typecheck
      - name: Lint
        if: steps.payload.outputs.present == 'true'
        run: npm run lint
      - name: Test
        if: steps.payload.outputs.present == 'true'
        run: npm run test
      - name: Production build
        if: steps.payload.outputs.present == 'true'
        run: npm run build
      - name: Commit validated source
        if: steps.payload.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: build production job search command center'
          git push origin HEAD:feature/production-job-search-command-center
