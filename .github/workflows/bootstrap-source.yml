name: Bootstrap source
on:
  push:
    branches: ['feature/production-job-search-command-center']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect source package
        id: payload
        shell: bash
        run: |
          if [ -f final2/chunk_00 ] && [ -f final2/chunk_01 ] && [ -f final2/chunk_02 ] && [ -f final2/chunk_03 ] && [ -f final2/chunk_04 ]; then
            echo "mode=final2" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply source package
        if: steps.payload.outputs.mode == 'final2'
        run: |
          cat final2/chunk_00 final2/chunk_01 final2/chunk_02 final2/chunk_03 final2/chunk_04 > /tmp/app.tar.gz.b64
          base64 -d /tmp/app.tar.gz.b64 > /tmp/app.tar.gz
          tar -xzf /tmp/app.tar.gz -C .
          rm -rf final final2
      - uses: actions/setup-node@v4
        if: steps.payload.outputs.mode == 'final2'
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.payload.outputs.mode == 'final2'
        run: npm install --no-audit --no-fund
      - name: Type check
        if: steps.payload.outputs.mode == 'final2'
        run: npm run typecheck
      - name: Lint
        if: steps.payload.outputs.mode == 'final2'
        run: npm run lint
      - name: Test
        if: steps.payload.outputs.mode == 'final2'
        run: npm run test
      - name: Production build
        if: steps.payload.outputs.mode == 'final2'
        run: npm run build
      - name: Commit validated source
        if: steps.payload.outputs.mode == 'final2'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize secure mobile job search command center'
          git push origin HEAD:feature/production-job-search-command-center
