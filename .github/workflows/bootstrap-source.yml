name: Bootstrap source
on:
  push:
    branches: ['feature/production-job-search-command-center']
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ hashFiles('bootstrap/app.tar.gz.b64') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand production source
        run: |
          base64 -d bootstrap/app.tar.gz.b64 > /tmp/app.tar.gz
          tar -xzf /tmp/app.tar.gz -C .
          rm -rf bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: build production job search command center'
          git push origin HEAD:feature/production-job-search-command-center
