name: Clean Analytics Dependency Record
on:
  push:
    branches: ['feature/vercel-analytics']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vercel-analytics
          fetch-depth: 0
      - name: Restore the existing lockfile and add only Vercel Analytics
        run: |
          git checkout origin/main -- package-lock.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('package-lock.json')
          data = json.loads(p.read_text())
          root = data['packages']['']['dependencies']
          root['@vercel/analytics'] = '^2.0.1'
          data['packages']['node_modules/@vercel/analytics'] = {
            'version': '2.0.1',
            'resolved': 'https://registry.npmjs.org/@vercel/analytics/-/analytics-2.0.1.tgz',
            'integrity': 'sha512-MTQG6V9qQrt1tsDeF+2Uoo5aPjqbVPys1xvnIftXSJYG2SrwXRHnqEvVoYID7BTruDz4lCd2Z7rM1BdkUehk2g==',
            'license': 'MIT',
            'peerDependencies': {
              '@remix-run/react': '^2',
              '@sveltejs/kit': '^1 || ^2',
              'next': '>= 13',
              'nuxt': '>= 3',
              'react': '^18 || ^19 || ^19.0.0-rc',
              'svelte': '>= 4',
              'vue': '^3',
              'vue-router': '^4'
            },
            'peerDependenciesMeta': {
              '@remix-run/react': {'optional': True},
              '@sveltejs/kit': {'optional': True},
              'next': {'optional': True},
              'nuxt': {'optional': True},
              'react': {'optional': True},
              'svelte': {'optional': True},
              'vue': {'optional': True},
              'vue-router': {'optional': True}
            }
          }
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Commit clean dependency record and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/clean-analytics-lock-temp.yml
          git add package-lock.json
          git commit -m 'chore: keep analytics lockfile change isolated'
          git push origin HEAD:feature/vercel-analytics
